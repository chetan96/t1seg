# CineMA (ConvUNetR) transfer baseline: M&Ms-finetuned model applied to T1-weighted images.
# M&Ms training spans 4 vendors and 6 centres, so this model may generalise better
# than the ACDC-trained one across scanner types.
#
#   python scripts/segment.py -c configs/pipeline/cinema_mnms.yaml --inputs data/slices/*.npz
#   python scripts/run_pipeline.py -c configs/pipeline/cinema_mnms.yaml --inputs data/slices/*.npz
device: auto
plugins: []
pipeline:
  size: 256
  segmenter:
    name: cinema
    dataset: mnms
    seed: 0
    recenter: true
    target_spacing: 1.0
  postprocess:
    - {name: largest_component, min_area_cm2: 5.0}
    - {name: shape_qc, max_eccentricity: 0.65}
    - {name: refine_from_reference, reference: longest_ti}
  aligner: {name: polar}
  fitter: {name: 2p}
  min_good_images: 8
