# CineMA (ConvUNetR) transfer baseline: ACDC-finetuned model applied to T1-weighted images.
# The model is downloaded from HuggingFace on first use (~510 MB).
#
#   python scripts/segment.py -c configs/pipeline/cinema_acdc.yaml --inputs data/slices/*.npz
#   python scripts/run_pipeline.py -c configs/pipeline/cinema_acdc.yaml --inputs data/slices/*.npz
#
# Override pixel-spacing resampling from the CLI:
#   --set pipeline.segmenter.target_spacing=1.0
device: auto
plugins: []
pipeline:
  size: 256
  segmenter:
    name: cinema
    dataset: acdc
    seed: 0
    recenter: true
    target_spacing: 1.0
  postprocess:
    - {name: largest_component, min_area_cm2: 5.0}
    - {name: shape_qc, max_eccentricity: 0.65}
    - {name: refine_from_reference, reference: longest_ti}
  aligner: {name: polar}
  fitter: {name: 2p}
  min_good_images: 8
